<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シャドウレイダーズダイス</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: manipulation;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            font-size: 1.3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 15px 0;
            flex-wrap: nowrap;
        }

        .dice-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .dice-wrapper:hover {
            transform: translateY(-5px);
        }

        .dice-wrapper:active {
            transform: translateY(0);
        }

        .dice-label {
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .tap-instruction {
            color: #ffd700;
            font-size: 0.95em;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 20px;
            margin-top: 5px;
            border: 2px solid rgba(255, 215, 0, 0.5);
        }

        .dice {
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4em;
            font-weight: bold;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            border: 4px solid rgba(255, 255, 255, 0.9);
        }

        .dice-six {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border-radius: 15px;
        }

        .dice-four {
            width: 120px;
            height: 120px;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            padding-top: 25px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), 
                        inset 0 0 0 4px rgba(255, 255, 255, 0.9);
        }

        .dice.rolling {
            animation: roll 0.5s ease-in-out;
        }

        @keyframes roll {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.1); }
        }

        .result-display {
            border-radius: 30px;
            padding: 20px 60px;
            margin: 20px auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            min-height: 120px;
            transition: all 0.3s;
        }

        .result-display.normal-mode {
            background: white;
        }

        .result-display.attack-mode {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        }

        .result-label {
            font-size: 1.5em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .result-display.normal-mode .result-label {
            color: #764ba2;
        }

        .result-display.attack-mode .result-label {
            color: white;
        }

        .result-value {
            font-size: 5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .result-display.normal-mode .result-value {
            color: #667eea;
        }

        .result-display.attack-mode .result-value {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .result-value.animate {
            animation: pulse 0.6s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .fail-message {
            font-size: 1.8em;
            margin-top: 10px;
            font-weight: bold;
            color: white;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .game-button {
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            padding: 25px 40px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            min-width: 200px;
        }

        .roll-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .roll-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
        }

        .roll-button:active {
            transform: translateY(-2px);
        }

        .attack-button {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .attack-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
        }

        .attack-button:active {
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            h1 { 
                font-size: 1.1em;
                margin-bottom: 8px;
            }
            .dice-container { 
                gap: 15px;
                margin: 10px 0;
            }
            .result-display {
                margin: 10px auto;
                padding: 15px 30px;
            }
            .button-container {
                gap: 10px;
                margin-top: 10px;
            }
            .dice { 
                width: 80px; 
                height: 80px; 
                font-size: 2.5em;
                border-width: 3px;
            }
            .dice-four { 
                width: 80px; 
                height: 80px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3), 
                            inset 0 0 0 3px rgba(255, 255, 255, 0.9);
            }
            .dice-label {
                font-size: 0.9em;
            }
            .result-value { font-size: 3em; }
            .tap-instruction {
                font-size: 0.7em;
                padding: 4px 8px;
            }
            .game-button { 
                font-size: 1em; 
                padding: 15px 25px;
                min-width: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ シャドウレイダーズダイス ⚔️</h1>

        <div class="dice-container">
            <div class="dice-wrapper" id="dice1Wrapper">
                <div class="dice-label">6面ダイス (赤)</div>
                <div class="dice dice-six" id="dice1">?</div>
                <div class="tap-instruction">👆 タップで1個振る</div>
            </div>
            <div class="dice-wrapper" id="dice2Wrapper">
                <div class="dice-label">4面ダイス (紫)</div>
                <div class="dice dice-four" id="dice2">?</div>
                <div class="tap-instruction">👆 タップで1個振る</div>
            </div>
        </div>

        <div class="result-display normal-mode" id="resultDisplay">
            <div class="result-label" id="resultLabel">合計</div>
            <div class="result-value" id="resultValue">-</div>
            <div class="fail-message" id="failMessage"></div>
        </div>

        <div class="button-container">
            <div class="game-button roll-button" id="rollButton">
                🎲 サイコロを振る
            </div>
            <div class="game-button attack-button" id="attackButton">
                ⚔️ 攻撃！
            </div>
        </div>
    </div>

    <script>
        const dice1 = document.getElementById('dice1');
        const dice2 = document.getElementById('dice2');
        const dice1Wrapper = document.getElementById('dice1Wrapper');
        const dice2Wrapper = document.getElementById('dice2Wrapper');
        const resultDisplay = document.getElementById('resultDisplay');
        const resultLabel = document.getElementById('resultLabel');
        const resultValue = document.getElementById('resultValue');
        const failMessage = document.getElementById('failMessage');
        const rollButton = document.getElementById('rollButton');
        const attackButton = document.getElementById('attackButton');
        
        let isRolling = false;
        let currentDice1 = 0;
        let currentDice2 = 0;

        function rollSingleDice(diceElement, maxValue, callback) {
            if (isRolling) return;
            isRolling = true;

            diceElement.classList.add('rolling');

            let counter = 0;
            const interval = setInterval(() => {
                diceElement.textContent = Math.floor(Math.random() * maxValue) + 1;
                counter++;
                
                if (counter > 10) {
                    clearInterval(interval);
                    
                    const result = Math.floor(Math.random() * maxValue) + 1;

                    setTimeout(() => {
                        diceElement.textContent = result;
                        diceElement.classList.remove('rolling');
                        
                        setTimeout(() => {
                            isRolling = false;
                            if (callback) callback(result);
                        }, 200);
                    }, 200);
                }
            }, 50);
        }

        function rollBothDice(isAttack = false) {
            if (isRolling) return;
            isRolling = true;

            dice1.classList.add('rolling');
            dice2.classList.add('rolling');

            let counter = 0;
            const interval = setInterval(() => {
                dice1.textContent = Math.floor(Math.random() * 6) + 1;
                dice2.textContent = Math.floor(Math.random() * 4) + 1;
                counter++;
                
                if (counter > 10) {
                    clearInterval(interval);
                    
                    currentDice1 = Math.floor(Math.random() * 6) + 1;
                    currentDice2 = Math.floor(Math.random() * 4) + 1;

                    setTimeout(() => {
                        dice1.textContent = currentDice1;
                        dice2.textContent = currentDice2;
                        
                        dice1.classList.remove('rolling');
                        dice2.classList.remove('rolling');

                        if (isAttack) {
                            showAttackResult();
                        } else {
                            showTotalResult();
                        }
                        
                        setTimeout(() => {
                            isRolling = false;
                        }, 600);
                    }, 200);
                }
            }, 50);
        }

        function showTotalResult() {
            const total = currentDice1 + currentDice2;
            
            resultDisplay.className = 'result-display normal-mode';
            resultLabel.textContent = '合計';
            resultValue.textContent = total;
            failMessage.textContent = '';
            
            resultValue.classList.add('animate');
            setTimeout(() => {
                resultValue.classList.remove('animate');
            }, 600);
        }

        function showAttackResult() {
            const difference = Math.abs(currentDice1 - currentDice2);
            
            resultDisplay.className = 'result-display attack-mode';
            resultLabel.textContent = '⚔️ 攻撃力 ⚔️';
            
            if (difference === 0) {
                resultValue.textContent = '攻撃失敗';
                resultValue.style.fontSize = '2.5em';
                failMessage.textContent = '';
            } else {
                resultValue.textContent = difference;
                resultValue.style.fontSize = '5em';
                failMessage.textContent = '';
            }
            
            resultValue.classList.add('animate');
            setTimeout(() => {
                resultValue.classList.remove('animate');
            }, 600);
        }

        // 個別のサイコロをクリック
        dice1Wrapper.addEventListener('click', (e) => {
            e.stopPropagation();
            rollSingleDice(dice1, 6, (result) => {
                currentDice1 = result;
                // 合計をクリア
                resultDisplay.className = 'result-display normal-mode';
                resultLabel.textContent = '合計';
                resultValue.textContent = '-';
                failMessage.textContent = '';
            });
        });

        dice2Wrapper.addEventListener('click', (e) => {
            e.stopPropagation();
            rollSingleDice(dice2, 4, (result) => {
                currentDice2 = result;
                // 合計をクリア
                resultDisplay.className = 'result-display normal-mode';
                resultLabel.textContent = '合計';
                resultValue.textContent = '-';
                failMessage.textContent = '';
            });
        });

        // 両方のサイコロを振る（合計表示）
        rollButton.addEventListener('click', () => {
            rollBothDice(false);
        });

        // 攻撃ボタン（新しくサイコロを振って攻撃力表示）
        attackButton.addEventListener('click', () => {
            rollBothDice(true);
        });
    </script>
</body>
</html>
