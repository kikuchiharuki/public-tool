<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ディフューザー 開き具合シミュレータ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23C1531F'/%3E%3Cpath d='M50 62V20M50 62 22 14M50 62 78 14' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3Crect x='33' y='62' width='34' height='22' rx='5' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f2f2ef; --panel:#ffffffee; --line:#dcdad4; --ink:#25262a; --dim:#8b8b86;
    --accent:#2f6fbe; --ng:#c4453a; --ok:#2f7d4f; --shadow:0 2px 14px rgba(0,0,0,.14);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font:13px/1.5 -apple-system,"Hiragino Sans",sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased}
  #c{position:absolute;inset:0;width:100vw;height:100vh;display:block;touch-action:none}

  .panel{position:absolute;top:10px;left:10px;z-index:3;width:268px;max-height:calc(100vh - 20px);
    overflow:auto;background:var(--panel);backdrop-filter:blur(8px);border-radius:11px;
    padding:10px 12px;box-shadow:var(--shadow)}
  .panel h1{font-size:14px;margin:0 0 2px}
  .panel .lead{font-size:11px;color:var(--dim);margin:0 0 8px}
  .grp{border-top:1px solid var(--line);margin-top:8px;padding-top:7px}
  .grp>b{font-size:11px;color:var(--dim);letter-spacing:.5px}
  .row{display:flex;align-items:center;gap:7px;margin-top:5px}
  .row.off{opacity:.35;pointer-events:none}
  .row label{flex:0 0 84px;font-size:12px}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
  .row .v{flex:0 0 52px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  button{font:12px/1 inherit;padding:6px 9px;border:1px solid var(--line);border-radius:7px;
    background:#fff;color:var(--ink);cursor:pointer}
  button:hover{border-color:#b9b6ae;background:#faf9f7}
  button.on{background:#e7effa;border-color:#7aa7dd;color:#1d4f8f}
  .out{margin-top:6px;font-size:12px}
  .out div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  .out .n{color:var(--dim)}
  .out .val{font-variant-numeric:tabular-nums}
  .ng{color:var(--ng);font-weight:bold}
  .ok{color:var(--ok)}
  .note{font-size:11px;color:var(--dim);margin-top:5px}
  .hint{position:absolute;right:10px;bottom:10px;z-index:3;background:var(--panel);
    border-radius:9px;padding:6px 10px;font-size:11px;color:var(--dim);box-shadow:var(--shadow)}
  @media (max-width:560px){
    .panel{right:10px;width:auto;max-height:46vh}
    .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel">
  <h1>🪷 ディフューザー 開き具合シミュレータ</h1>
  <p class="lead">スティックサポーターの穴の角度を変えて、広がり方と干渉を試す。寸法の既定値は実測値。</p>

  <div class="grp"><b>モデル</b>
    <div class="btns">
      <button data-mode="ring">5本・丸穴</button>
      <button data-mode="fan">5本・扇（正面から扇状）</button>
      <button data-mode="room">10本・部屋仕切り（外壁なし）</button>
    </div>
    <div class="note" id="modeNote"></div>
  </div>

  <div class="grp"><b>スティックの配り方</b>
    <div class="row" id="row_N"><label>本数</label><input type="range" id="N" min="3" max="12" step="1"><span class="v" id="N_v"></span></div>
    <div class="row"><label id="tiltLabel">傾き</label><input type="range" id="TILT" min="0" max="30" step="0.1"><span class="v" id="TILT_v"></span></div>
    <div class="row" title="スティックどうしが一番近づく（上から見て交わる）高さ。差し込み部の下端から測る"><label>交点の高さ</label><input type="range" id="ZW" min="-10" max="80" step="0.5"><span class="v" id="ZW_v"></span></div>
    <div class="row" id="row_TWIST"><label>ねじり</label><input type="range" id="TWIST" min="0" max="90" step="5"><span class="v" id="TWIST_v"></span></div>
    <div class="btns" id="row_ORDER">
      <button data-order="center">開き優先</button>
      <button data-order="lr">一列（左が手前）</button>
      <button data-order="rl">一列（右が手前）</button>
      <button id="fanMax">上限まで開く</button>
    </div>
    <div class="row" id="row_PITCH"><label>前後の間隔</label><input type="range" id="PITCH" min="1.5" max="6" step="0.1"><span class="v" id="PITCH_v"></span></div>
    <div class="row" id="row_THROAT"><label>穴の半径</label><input type="range" id="THROAT" min="0" max="7" step="0.1"><span class="v" id="THROAT_v"></span></div>
    <div class="row"><label>スティック径</label><input type="range" id="SD" min="1.5" max="5" step="0.1"><span class="v" id="SD_v"></span></div>
    <div class="row"><label>長さ</label><input type="range" id="SL" min="120" max="350" step="5"><span class="v" id="SL_v"></span></div>
  </div>

  <div class="grp"><b>瓶（実測値）</b>
    <div class="row"><label>胴の外径</label><input type="range" id="BD" min="40" max="110" step="0.1"><span class="v" id="BD_v"></span></div>
    <div class="row"><label>中の深さ</label><input type="range" id="DEPTH" min="30" max="140" step="1"><span class="v" id="DEPTH_v"></span></div>
    <div class="row"><label>口の内径</label><input type="range" id="MD" min="10" max="30" step="0.1"><span class="v" id="MD_v"></span></div>
  </div>

  <div class="grp"><b>サポーター</b>
    <div class="row"><label>差し込み長</label><input type="range" id="PL" min="5" max="30" step="0.5"><span class="v" id="PL_v"></span></div>
  </div>

  <div class="grp"><b>瓶の中で最大に開く</b>
    <div class="row"><label>先端の上限</label><input type="range" id="TIPF" min="0.8" max="1.5" step="0.05"><span class="v" id="TIPF_v"></span></div>
    <div class="btns"><button id="maxInside">瓶の中で最大に開く</button><button id="toCorner">隅まで届かせる</button></div>
    <div class="note" id="maxNote">「最大に開く」: 先端の広がりを「瓶の外径×上限」以内に抑えたまま、瓶の底での広がりを最大にする。「隅まで届かせる」: 普段の使い方のように全部のスティックを瓶の底の隅まで届かせる（先端の上限は見ない）。そこから手で調整できる。</div>
  </div>

  <div class="grp"><b>結果</b>
    <div class="out" id="out"></div>
  </div>

  <div class="grp"><b>視点・プリセット</b>
    <div class="btns">
      <button data-view="iso">斜め</button>
      <button data-view="front">正面</button>
      <button data-view="top">真上</button>
      <button id="reset">既定値に戻す</button>
    </div>
  </div>
</div>

<div class="hint">ドラッグ=回転 / ホイール=ズーム / 右ドラッグ=平行移動</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// 座標: z=0 が差し込み部の下端、z=PL が瓶の口の上端。瓶の中は z<PL。
// 既定値は設計値/実測値（丸穴5本.py・瓶ダミー.py）:
//   口の穴16.8 / 差し込み長15 / 中の深さ62 / スティックφ3.0・長さ250 / 胴の外径70.5
// モード: ring=5本・丸穴 / fan=5本・扇 / room=10本・部屋仕切り
// 傾きスライダーはモードごとに別の値を持つ: TILT=丸穴の傾き(12°)、FAN=扇の両端の開き角(40°)、
// TOUT=10本版の一番外側の傾き(10°)。PITCH=扇で前後にずらす面の間隔（スティック径＋0.3）。
// ORDER=扇の前後の並び: center=傾きの大きいものを中央寄りの面に（開き優先）/ lr・rl=左右の順に一列
// ZW5/ZWF/ZW10=モードごとの交点（喉・扇の要）の高さ。差し込み部の下端から。既定は各3Dモデルと同じ。
// TIPF=「瓶の中で最大に開く」で先端の広がりを抑える上限（瓶の外径比。1.10＝外径から一回り）。
const DEF = {MODE:'ring', ORDER:'center', ZW5:0, ZWF:4.7, ZW10:7.9, TIPF:1.10, N:5, TILT:12, FAN:40, TOUT:10, TWIST:90, THROAT:3.8, PITCH:3.3,
             SD:3.0, SL:250, BD:70.5, DEPTH:62, MD:16.8, PL:15};
const KEYS = ['N','TILT','ZW','TWIST','PITCH','THROAT','SD','SL','BD','DEPTH','MD','PL','TIPF'];
const TILT_KEY = {ring:'TILT', fan:'FAN', room:'TOUT'};
const tiltKey = () => TILT_KEY[P.MODE];
const TILT_MAX = {ring:45, fan:90, room:45};      // 隅まで届かせると30°前後になるので余裕を持たせる
const zwKey = () => ({ring:'ZW5', fan:'ZWF', room:'ZW10'})[P.MODE];
const realKey = k => k === 'TILT' ? tiltKey() : k === 'ZW' ? zwKey() : k;   // モード別の値を持つスライダー
const P = {...DEF};
// サポーターと瓶の固定寸法（実測・設計値）
const FLANGE_W = 3.75, FLANGE_T = 0.8, PLUG_GAP = 0.2;   // ツバ張り出し/厚み・口とのすき間
const NECK_H = 16.6, NECK_D = 26.8;
const INNER_WALL = 4.0, BOTTOM_T = 9.0;                  // 胴の壁厚・底の厚み（実測）
const BORE_GAP = 0.2;     // 10本版: スティック外面と瓶の口の内面のすき間（外壁は作らず口が壁になる）

// 10本版の断面レイアウト（z=ZTでの軸位置を半径上限で正規化したもの。最小間隔を最大化した配置。
// 部屋10本.py（外壁なし版）の PTS/R_LIM と同じ。Python側を変えたらここも更新）
const PTS10 = [[-0.31895,0.00111],[0.82869,0.55971],[-0.4653,-0.88515],[0.24052,-0.97065],
               [-0.93592,-0.35222],[-0.45911,0.88838],[0.39202,-0.00137],[-0.93343,0.35875],
               [0.24729,0.96894],[0.82476,-0.56549]];

const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf2f2ef);
const cam = new THREE.PerspectiveCamera(40, 1, 1, 5000); cam.up.set(0,0,1);
const ctl = new OrbitControls(cam, canvas);
ctl.enableDamping = true; ctl.dampingFactor = .12; ctl.screenSpacePanning = true;
ctl.minPolarAngle = 1e-3; ctl.maxPolarAngle = Math.PI - 1e-3;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a80, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(-1,-1.2,2); scene.add(sun);
const root = new THREE.Group(); scene.add(root);

// ── 幾何 ──────────────────────────────────────────────────────────────
const plugD = () => P.MD - PLUG_GAP;
const zBottom = () => P.PL - P.DEPTH;

// 5本版: 円周に並べた穴。ねじり0°=真横に開くだけ、90°=接線方向にねじる（双曲面の母線）。
function line5(i){
  const phi = 2*Math.PI*i/P.N;
  const t = P.TILT*Math.PI/180, b = P.TWIST*Math.PI/180;
  const sr = Math.sin(t)*Math.cos(b), st = Math.sin(t)*Math.sin(b);
  const d = new THREE.Vector3(Math.cos(phi)*sr - Math.sin(phi)*st,
                              Math.sin(phi)*sr + Math.cos(phi)*st, Math.cos(t));
  // 交点の高さ ZW5 で軸から THROAT の位置を通る
  const pw = new THREE.Vector3(P.THROAT*Math.cos(phi), P.THROAT*Math.sin(phi), P.ZW5);
  return {p: pw.addScaledVector(d, -P.ZW5 / d.z), d};
}
// 10本版: 断面が高さに応じて回転・拡大するだけの直線群。外側ほど傾きが大きく、互いに交わらない。
function geom10(){
  const ZT = P.ZW10, TOP = P.PL + FLANGE_T;                  // 断面が一番小さくなる高さ（既定は差し込み部の中央）
  const R0 = Math.max(0.1, P.MD/2 - P.SD/2 - BORE_GAP);     // 端での軸位置の半径上限（瓶の口で決まる）
  const K = Math.tan(P.TOUT*Math.PI/180) / R0;                // ねじれ率[1/mm]
  const R = R0 / Math.max(Math.hypot(1, ZT*K), Math.hypot(1, (TOP - ZT)*K));   // 差し込み部の両端で口に収める
  return {ZT, K, R};
}
function line10(i){
  const {ZT, K, R} = geom10();
  const x0 = PTS10[i][0]*R, y0 = PTS10[i][1]*R;
  return {
    p: new THREE.Vector3(x0 + ZT*K*y0, y0 - ZT*K*x0, 0),
    d: new THREE.Vector3(-K*y0, K*x0, 1).normalize()
  };
}
// 扇: 正面(XZ面)から見て5本が扇状に開く。1本ずつ前後(y)にずらした別々の面に置くので、
// 正面から見て交差しても実際には当たらない（最接近＝前後の間隔）。
// 傾きの大きいスティックほど中央寄りの面に置き、端の面でも瓶の口に収まるようにする。
// 扇の要（正面から見て交わる高さ）は ZWF。既定は口の穴の上下中央。3Dモデルは 扇5本.py（既定と同じ配置）。
// i本目(角度 -2θ,-θ,0,θ,2θ)を置く面(×PITCH、負が手前)。
// 一列だと傾きの大きい両端が前後の端の面に来るので、口に収まる開き角は小さくなる。
const FAN_SLOT = {center:[1, 2, -2, -1, 0], lr:[-2, -1, 0, 1, 2], rl:[2, 1, 0, -1, -2]};
function lineFan(i){
  const a = (i - 2) * P.FAN/4 * Math.PI/180;
  const zc = P.ZWF;
  return {
    p: new THREE.Vector3(-zc*Math.tan(a), FAN_SLOT[P.ORDER][i]*P.PITCH, 0),
    d: new THREE.Vector3(Math.sin(a), 0, Math.cos(a))
  };
}
const nSticks = () => P.MODE === 'room' ? 10 : P.MODE === 'fan' ? 5 : P.N;
const stickLine = i => ({ring:line5, fan:lineFan, room:line10})[P.MODE](i);
const at = (L, z) => L.p.clone().addScaledVector(L.d, z / L.d.z);   // 中心線上の高さzの点

// 瓶の内側の半径（高さzで）。口の穴と胴の空洞が段でつながる（bottle_dummy.py と同じ）。
function rInner(z){
  const zNeck = P.PL - NECK_H;
  return z >= zNeck - INNER_WALL ? P.MD/2 : P.BD/2 - INNER_WALL;
}

// ── 描画 ──────────────────────────────────────────────────────────────
const matStick = new THREE.MeshStandardMaterial({color:0xd8ccb8, roughness:.8, metalness:0});
const matStickNG = new THREE.MeshStandardMaterial({color:0xc4453a, roughness:.8, metalness:0});
const matPlug = new THREE.MeshStandardMaterial({color:0x59605f, roughness:.6, metalness:0,
  transparent:true, opacity:.5});
const matGlass = new THREE.MeshStandardMaterial({color:0x8fb8c8, roughness:.25, metalness:0,
  transparent:true, opacity:.22, side:THREE.DoubleSide});
const Y = new THREE.Vector3(0,1,0);

function clear(g){ for(const o of g.children.slice()){ g.remove(o); o.geometry?.dispose(); } }

function rod(a, b, r, mat){                        // a→b の円柱
  const v = b.clone().sub(a), len = v.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 24), mat);
  m.quaternion.setFromUnitVectors(Y, v.clone().normalize());
  m.position.copy(a).addScaledVector(v, .5);
  return m;
}
function zCyl(r, h, z0, mat){                      // z0から高さhの円柱（Z軸）
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 48), mat);
  m.rotation.x = Math.PI/2; m.position.z = z0 + h/2; return m;
}

function buildBottle(){
  // 底の外面は「中の底 - 底の厚み」。胴の高さの実測54.8とは0.4mm差（実測誤差）が出る。
  const zNeck = P.PL - NECK_H, zBody = zBottom() - BOTTOM_T;
  const pts = [[0,zBody],[P.BD/2,zBody],[P.BD/2,zNeck],[NECK_D/2,zNeck],[NECK_D/2,P.PL]]
    .map(([r,z]) => new THREE.Vector2(r, z));
  // LatheGeometryはY軸まわりに回すので、Z上の座標系に合わせて倒す
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts, 64), matGlass);
  m.rotation.x = Math.PI/2; root.add(m);
}
function buildPlug(){
  root.add(zCyl(plugD()/2, P.PL, 0, matPlug));
  root.add(zCyl(plugD()/2 + FLANGE_W, FLANGE_T, P.PL, matPlug));
}

// ── 計算（干渉と広がり）─────────────────────────────────────────────────
function analyze(){
  const n = nSticks();
  const lines = Array.from({length:n}, (_,i) => stickLine(i));
  const zb = zBottom(), r = P.SD/2;
  // スティックは下端を瓶の底に置く
  const ends = lines.map(L => {
    const t0 = zb / L.d.z;
    return {a: L.p.clone().addScaledVector(L.d, t0),
            b: L.p.clone().addScaledVector(L.d, t0 + P.SL), L};
  });

  let gap = Infinity;                              // スティック同士のすき間
  if (n > 1){
    const S = 200;
    for (let s = 0; s <= S; s++){
      const pts = ends.map(e => e.a.clone().lerp(e.b, s/S));
      for (let i = 0; i < n; i++)
        for (let j = i+1; j < n; j++) gap = Math.min(gap, pts[i].distanceTo(pts[j]));
    }
    gap -= P.SD;
  }
  // 瓶とのすき間。口（首の穴）は壁の役なのでスティックが接触してよい。胴の中で壁に当たるのはNG。
  let bore = Infinity, wall = Infinity;
  const zNeck = P.PL - NECK_H - INNER_WALL;
  for (const e of ends){
    for (let s = 0; s <= 120; s++){
      const z = zb + (P.PL - zb) * s/120;
      const c = at(e.L, z), g = rInner(z) - Math.hypot(c.x, c.y) - r;
      if (z >= zNeck) bore = Math.min(bore, g); else wall = Math.min(wall, g);
    }
  }
  // 扇は正面から見た左右の幅、それ以外は上から見た外接円の直径
  const xs = ends.map(e => e.b.x);
  const spread = P.MODE === 'fan' ? Math.max(...xs) - Math.min(...xs) + P.SD
    : 2 * Math.max(...ends.map(e => Math.hypot(e.b.x, e.b.y) + r));
  const inside = 2 * Math.max(...ends.map(e => Math.hypot(e.a.x, e.a.y) + r));   // 瓶の底での外接円の直径
  const tilts = lines.map(L => Math.acos(L.d.z) * 180/Math.PI);
  return {ends, gap, bore, wall, spread, inside, reach: ends[0].b.z - P.PL,
          tmin: Math.min(...tilts), tmax: Math.max(...tilts)};
}

const TOUCH = 0.05;                               // これ以下のめり込みは「接触」とみなす（計算誤差）
const isBad = A => A.gap < 0 || A.wall < 0 || A.bore < -TOUCH;
// 扇: いまの並び・間隔で干渉しない開き角の上限（二分探索）
function fanLimit(){
  const keep = P.FAN;
  let lo = 0, hi = TILT_MAX.fan;
  P.FAN = lo; if (isBad(analyze())) { P.FAN = keep; return null; }
  for (let k = 0; k < 18; k++){ P.FAN = (lo + hi)/2; if (isBad(analyze())) hi = P.FAN; else lo = P.FAN; }
  P.FAN = keep;
  return Math.floor(lo*10)/10;                     // スライダーの刻み0.1°に切り下げ
}

// 瓶の中で最大に開く（最優先）: 瓶の底での広がりを最大にする。守るのは干渉なしと
// 先端の広がり ≤ 瓶の外径×TIPF だけで、配り方の値（傾き・交点の高さ・ねじり・穴の半径・扇の並びと間隔）は変えてよい。
// 配り方の組ごとに、交点の高さを振り、各高さで先端上限に収まる最大の傾きを二分探索する
// （傾きを上げるほど底も先端も広がるので、傾きは上限が最良）。
// goal='inside': 先端上限内で底の広がりを最大に / goal='corner': 底の隅（内壁）まで届かせ、その中で先端の広がりが最小
const CORNER_TOUCH = 1.0;                          // 内壁とのすき間がこれ以下なら「隅に届いた」とみなす
function searchZT(goal){
  const tk = tiltKey(), zk = zwKey();
  const tmax = TILT_MAX[P.MODE];
  const fits = () => {
    const A = analyze();
    return !isBad(A) && (goal === 'corner' || A.spread <= P.TIPF*P.BD + 1e-6) ? A : null;
  };
  // 大きいほど良い。隅: 届いた組を優先し、その中で先端が狭いもの
  const score = A => goal === 'inside' ? A.inside
    : A.wall <= CORNER_TOUCH ? 1e6 - A.spread : A.inside;
  const maxTilt = () => {
    P[tk] = 0; if (!fits()) return null;
    let lo = 0, hi = tmax;
    for (let k = 0; k < 16; k++){ P[tk] = (lo + hi)/2; if (fits()) lo = P[tk]; else hi = P[tk]; }
    return Math.floor(lo*10)/10;                   // スライダーの刻み0.1°に切り下げ
  };
  let best = null;
  const tryZ = z => {
    P[zk] = z; const t = maxTilt(); if (t === null) return;   // 傾きを上げるほど底が広がるので、傾きは上限が最良
    P[tk] = t; const A = fits();
    if (A && (!best || score(A) > best.score)) best = {z, t, inside: A.inside, spread: A.spread, wall: A.wall, score: score(A)};
  };
  for (let z = -10; z <= 80; z += 4) tryZ(z);
  if (best) for (let z = best.z - 4; z <= best.z + 4; z += 0.5) tryZ(z);
  return best;
}
const grid = (lo, hi, step) => Array.from({length: Math.floor((hi - lo)/step + 1e-9) + 1}, (_, k) => +(lo + k*step).toFixed(2));
const combos = o => Object.entries(o).reduce((acc, [k, vs]) => acc.flatMap(a => vs.map(v => ({...a, [k]: v}))), [{}]);
function maximizeInside(goal){
  const variants = {
    ring: combos({TWIST: [0, 30, 60, 90], THROAT: grid(0, P.MD/2, 0.5)}),
    fan:  combos({ORDER: ['center', 'lr', 'rl'], PITCH: [0.3, 0.6, 1, 1.5].map(g => +(P.SD + g).toFixed(1))}),
    room: [{}],                                    // 10本は配置が決まっているので傾きと交点だけ
  }[P.MODE];
  const snap = {...P};
  let best = null;
  for (const v of variants){
    Object.assign(P, v);
    const b = searchZT(goal);
    if (b && (!best || b.score > best.score)) best = {...b, v};
  }
  Object.assign(P, snap);
  if (!best) return null;
  Object.assign(P, best.v); P[zwKey()] = best.z; P[tiltKey()] = best.t;
  return best;
}

function render(){
  clear(root);
  const A = analyze();
  buildBottle(); buildPlug();
  const bad = isBad(A);
  for (const e of A.ends) root.add(rod(e.a, e.b, P.SD/2, bad ? matStickNG : matStick));

  const f = (v, u='mm') => v.toFixed(1) + u;
  const judge = (v, t) => `<span class="${v < 0 ? 'ng' : 'ok'}">${t}</span>`;
  $('out').innerHTML = [
    [P.MODE === 'fan' ? '先端の広がり（正面の幅）' : '先端の広がり（直径）', f(A.spread)],
    ['瓶の底での広がり（直径）', f(A.inside)],
    ['瓶の口から出る長さ', f(A.reach)],
    ['スティック同士のすき間', nSticks() > 1 ? judge(A.gap, f(A.gap)) : '—'],
    ['瓶の口とのすき間', A.bore < -TOUCH ? `<span class="ng">口より外（${f(A.bore)}）</span>`
        : A.bore <= TOUCH ? '<span class="ok">接触（口が受ける）</span>' : judge(A.bore, f(A.bore))],
    ['胴の内壁とのすき間', judge(A.wall, f(A.wall))],
    ['傾き（鉛直から）', A.tmax - A.tmin < .05 ? f(A.tmax, '°')
        : `${A.tmin.toFixed(1)}〜${A.tmax.toFixed(1)}°`],
    ...(P.MODE === 'fan' ? [['この並びで開ける上限', (v => v === null ? '—' : f(v, '°'))(fanLimit())]] : []),
  ].map(([n,v]) => `<div><span class="n">${n}</span><span class="val">${v}</span></div>`).join('')
    + (bad ? '<div class="ng" style="margin-top:4px">干渉あり: 傾き・本数・スティック径を見直す</div>' : '');
}

// ── 視点 ──────────────────────────────────────────────────────────────
function setView(kind){
  const h = P.SL + P.PL, cz = P.PL - P.DEPTH/2 + h/3;
  const dist = Math.max(h, P.BD*2) * 1.15;
  ctl.target.set(0, 0, cz);
  if (kind === 'top')        cam.position.set(0.01, 0, cz + dist);
  else if (kind === 'front') cam.position.set(0, -dist, cz);
  else                       cam.position.set(-dist*.62, -dist*.62, cz + dist*.42);
  ctl.update();
}

// ── UI ────────────────────────────────────────────────────────────────
const UNIT = {N:'本', TILT:'°', ZW:'mm', TIPF:'', TWIST:'°', PITCH:'mm', THROAT:'mm', SD:'mm', SL:'mm', BD:'mm', DEPTH:'mm', MD:'mm', PL:'mm'};
// 保存キーに版番号を付ける。既定値を実測値に入れ替えたとき、前に開いた人の古い保存値が
// そのまま残って「既定値のはずが違う」状態になるのを避けるため。既定値を変えたら上げる。
const KEY = 'diffuser-stick-spread.v4';
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} };

const MODE_NOTE = {
  ring: '円周に並べた5つの丸穴。接線方向にねじって開く。',
  fan:  '正面から見て扇状に開く5本。1本ずつ前後にずらした面に置くので、正面から重なって見えても当たらない。傾きの大きいスティックほど中央寄りの面に置く。',
  room: '10本を仕切り壁の部屋に通し、断面ごと回しながら開くので互いに交わらない。外壁は作らず、瓶の口が壁の役をする（スティックは口に接触してよい）。',
};
function syncUI(){
  $('TILT').max = TILT_MAX[P.MODE];               // 値を入れる前に範囲を合わせる
  for (const k of KEYS){
    const v = P[realKey(k)];
    $(k).value = v;
    $(k+'_v').textContent = k === 'N' ? v + UNIT[k] : k === 'TIPF' ? '×' + v.toFixed(2)
      : (+v).toFixed(1) + UNIT[k];
  }
  const ring = P.MODE === 'ring';
  $('row_N').classList.toggle('off', !ring);       // 扇・10本版は本数固定
  $('row_TWIST').classList.toggle('off', !ring);
  $('row_THROAT').classList.toggle('off', !ring);
  $('row_PITCH').classList.toggle('off', P.MODE !== 'fan');
  $('row_ORDER').style.display = P.MODE === 'fan' ? '' : 'none';
  for (const b of document.querySelectorAll('[data-order]')) b.classList.toggle('on', b.dataset.order === P.ORDER);
  $('tiltLabel').textContent = {ring:'傾き', fan:'開き角（両端）', room:'外側の傾き'}[P.MODE];
  $('N_v').textContent = nSticks() + '本';
  $('modeNote').textContent = MODE_NOTE[P.MODE];
  for (const b of document.querySelectorAll('[data-mode]')) b.classList.toggle('on', b.dataset.mode === P.MODE);
}
for (const k of KEYS){
  $(k).addEventListener('input', () => {
    P[realKey(k)] = +$(k).value;
    if (k === 'MD') P.THROAT = Math.min(P.THROAT, P.MD/2);
    syncUI(); render(); save();
  });
}
for (const b of document.querySelectorAll('[data-mode]'))
  b.onclick = () => {
    P.MODE = b.dataset.mode; syncUI(); render(); save();
    if (P.MODE === 'fan') setView('front');       // 扇は正面から見る形なので正面に向ける
  };
for (const b of document.querySelectorAll('[data-order]'))
  b.onclick = () => { P.ORDER = b.dataset.order; syncUI(); render(); save(); };
function runMaximize(goal){
  $('maxNote').textContent = '計算中…';
  setTimeout(() => {                                // 「計算中」を描いてから重い探索に入る
    const b = maximizeInside(goal);
    const ORDER_NAME = {center:'開き優先', lr:'一列（左が手前）', rl:'一列（右が手前）'};
    const changed = b ? [`傾き ${b.t}°`, `交点の高さ ${b.z.toFixed(1)}mm`, ...Object.entries(b.v).map(([k, v]) =>
      ({TWIST:`ねじり${v}°`, THROAT:`穴の半径${v}mm`, ORDER:`並び ${ORDER_NAME[v]}`, PITCH:`前後の間隔${v}mm`})[k])] : [];
    $('maxNote').textContent = !b ? '条件を満たす開き方が見つからない（先端の上限を上げるか、スティック径・本数を見直す）。'
      : goal === 'inside'
        ? `先端 ${(P.TIPF*P.BD).toFixed(0)}mm 以内で、瓶の底での広がり ${b.inside.toFixed(1)}mm。（${changed.join('・')}）`
        : b.wall <= CORNER_TOUCH
          ? `隅まで届いた: 瓶の底での広がり ${b.inside.toFixed(1)}mm、先端 ${b.spread.toFixed(0)}mm。（${changed.join('・')}）`
          : `口の穴や他のスティックに当たって隅まで届かない。一番広い底 ${b.inside.toFixed(1)}mm。（${changed.join('・')}）`;
    syncUI(); render(); save();
  }, 30);
}
$('maxInside').onclick = () => runMaximize('inside');
$('toCorner').onclick = () => runMaximize('corner');
$('fanMax').onclick = () => { const v = fanLimit(); if (v !== null){ P.FAN = v; syncUI(); render(); save(); } };
for (const b of document.querySelectorAll('[data-view]')) b.onclick = () => setView(b.dataset.view);
$('reset').onclick = () => { Object.assign(P, DEF); syncUI(); render(); setView('iso'); save(); };

try{
  const s = JSON.parse(localStorage.getItem(KEY) || '{}');
  for (const k of [...KEYS,'FAN','TOUT','ZW5','ZWF','ZW10']) if (typeof s[k] === 'number') P[k] = s[k];
  const m = {5:'ring', 10:'room'}[s.MODE] ?? s.MODE;   // 以前は数値で保存していた
  if (m in TILT_KEY) P.MODE = m;
  if (s.ORDER in FAN_SLOT) P.ORDER = s.ORDER;
}catch(e){}

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize(); syncUI(); render(); setView(P.MODE === 'fan' ? 'front' : 'iso');
(function loop(){ requestAnimationFrame(loop); ctl.update(); renderer.render(scene, cam); })();
</script>
</body>
</html>
