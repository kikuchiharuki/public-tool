<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蛇腹サポーター STL生成</title>
<style>
  *{box-sizing:border-box}
  body{font-family:"Hiragino Kaku Gothic ProN",sans-serif;margin:0;display:flex;height:100vh;background:#1d1d1f;color:#eee}
  #panel{width:360px;padding:14px 16px;overflow-y:auto;background:#2a2a2d;flex-shrink:0}
  h1{font-size:15px;margin:0 0 2px}
  .sub{font-size:11px;color:#888;margin-bottom:10px;line-height:1.6}
  .step{margin:14px 0 6px;font-size:13px;font-weight:bold;color:#7fd0a0}
  .step .n{display:inline-block;background:#2a8a55;color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;font-size:11px;margin-right:6px}
  label{display:block;font-size:12px;margin:10px 0 3px;color:#bbb}
  .val{float:right;color:#7fd0a0;font-size:12px}
  .range{font-size:11px;color:#888;margin-top:3px}
  .srow{display:flex;align-items:center;gap:6px}
  .srow input[type=range]{flex:1}
  .srow input[type=number]{width:64px;font-size:13px;padding:4px;background:#18181a;color:#eee;border:1px solid #555;border-radius:5px;text-align:right}
  .mb{width:30px;height:26px;flex-shrink:0;background:#3a3a3e;color:#fff;border:1px solid #555;border-radius:5px;font-size:15px;cursor:pointer;padding:0}
  .mb:hover{background:#4a4a50}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  select{width:100%;font-size:13px;padding:6px;background:#18181a;color:#eee;border:1px solid #555;border-radius:5px}
  details{margin-top:14px;border-top:1px solid #3a3a3e;padding-top:8px}
  summary{font-size:12px;color:#aaa;cursor:pointer}
  #info{margin-top:14px;background:#222225;border:1px solid #3a3a3e;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.7;color:#ccc}
  #info b{color:#eee;font-weight:normal}
  #info .warn{color:#f0b060}
  #info .ng{color:#ff7a70}
  .btn{width:100%;margin-top:10px;border:none;color:#fff;font-weight:bold;padding:11px;border-radius:8px;cursor:pointer;font-size:15px;background:#2a8a55}
  .btn:hover{background:#33a866}
  .btn:disabled{background:#555;cursor:not-allowed}
  #summary{margin-top:10px;background:#26262a;border:1px solid #444;border-radius:8px;padding:8px;font-size:11px;line-height:1.6;color:#ccc;word-break:break-all}
  #summary b{color:#7fd0a0}
  #copyBtn{width:100%;margin-top:6px;background:#3a3a3e;color:#eee;border:1px solid #555;border-radius:5px;font-size:11px;padding:4px;cursor:pointer}
  #view{flex:1;position:relative;min-width:0}
  #status{position:absolute;left:14px;bottom:10px;font-size:12px;color:#999}
  #hint{position:absolute;left:14px;top:12px;font-size:11px;color:#777}
  @media (max-width:760px){
    body{flex-direction:column;height:auto}
    #panel{width:100%;order:2}
    #view{height:55vh;flex:none;order:1}
  }
</style>
</head>
<body>
<div id="panel">
  <h1>蛇腹サポーター STL生成</h1>
  <div class="sub">ホースや紐を好きな円弧に沿わせて保持する板バネ。3つの値を決めるとSTLができます。平らな面を下にして、サポートなしで印刷します。</div>

  <div class="step"><span class="n">1</span>ホース・紐の直径</div>
  <label>直径 <span class="val" id="DV"></span></label>
  <div class="srow"><button class="mb" data-t="D" data-d="-1">−</button><input type="range" id="D" min="4" max="30" step="0.1" value="12"><button class="mb" data-t="D" data-d="1">＋</button><input type="number" id="Dn" min="4" max="30" step="0.1"></div>

  <div class="step"><span class="n">2</span>弧の角度</div>
  <label>角度（360°で一周） <span class="val" id="thetaV"></span></label>
  <div class="srow"><button class="mb" data-t="theta" data-d="-1">−</button><input type="range" id="theta" min="30" max="360" step="1" value="100"><button class="mb" data-t="theta" data-d="1">＋</button><input type="number" id="thetan" min="30" max="360" step="1"></div>

  <div class="step"><span class="n">3</span>蛇腹の長さ</div>
  <label>ホースに沿った長さ（両端ブロックを除く） <span class="val" id="lenV"></span></label>
  <div class="srow"><button class="mb" data-t="len" data-d="-1">−</button><input type="range" id="len" min="30" max="400" step="0.1" value="99.8"><button class="mb" data-t="len" data-d="1">＋</button><input type="number" id="lenn" step="0.1"></div>
  <div class="range" id="lenRange"></div>

  <div class="step"><span class="n">4</span>蛇腹の間隔</div>
  <select id="gapPreset">
    <option value="">（下のスライダーで個別に）</option>
    <option value="10,10">全体を大きく</option>
    <option value="3,3">全体を小さく</option>
    <option value="10,3" selected>手前が大きく、奥が小さく</option>
    <option value="3,10">手前が小さく、奥が大きく</option>
  </select>
  <label>手前側の間隔 <span class="val" id="gapAV"></span></label>
  <div class="srow"><button class="mb" data-t="gapA" data-d="-1">−</button><input type="range" id="gapA" min="0" max="15" step="0.5" value="10"><button class="mb" data-t="gapA" data-d="1">＋</button></div>
  <label>奥側の間隔 <span class="val" id="gapBV"></span></label>
  <div class="srow"><button class="mb" data-t="gapB" data-d="-1">−</button><input type="range" id="gapB" min="0" max="15" step="0.5" value="3"><button class="mb" data-t="gapB" data-d="1">＋</button></div>
  <label>手前→奥の変わり方</label>
  <select id="gapMode">
    <option value="half" selected>半分のところで切り替える</option>
    <option value="linear">なだらかに変える</option>
  </select>

  <div class="step"><span class="n">5</span>先の形</div>
  <div class="row2">
    <div><label>手前の端</label>
      <select id="endA"><option value="clip" selected>押し込み口</option><option value="neck">先細</option><option value="flat">全幅</option></select></div>
    <div><label>奥の端</label>
      <select id="endB"><option value="clip">押し込み口</option><option value="neck" selected>先細</option><option value="flat">全幅</option></select></div>
  </div>
  <div class="range">押し込み口＝溝が少し太く、中ほどの天面が開いて真上から押し込める／先細＝先端が細くなる／全幅＝四角いまま</div>

  <details>
    <summary>詳細設定</summary>
    <label>押し込み口の溝を太くする <span class="val" id="clipV"></span></label>
    <div class="srow"><button class="mb" data-t="clip" data-d="-1">−</button><input type="range" id="clip" min="0" max="3" step="0.1" value="1"><button class="mb" data-t="clip" data-d="1">＋</button></div>
  </details>

  <div id="info"></div>
  <button class="btn" id="dlstl">STLをダウンロード</button>
  <div id="summary"></div>
</div>
<div id="view"><div id="hint">ドラッグで回転・ホイールで拡大／オレンジはホースの通り道</div><div id="status"></div></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/",
  "manifold-3d":"https://unpkg.com/manifold-3d@2.5.1/manifold.js"
}}
</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import Module from "manifold-3d";
const wasm=await Module(); wasm.setup();
const $=id=>document.getElementById(id);

// ==CORE BEGIN==
// 蛇腹サポーター 生成コア（チューブサポーター2 の params/geom/build_open を移植）
// 座標: 平らな状態で組み立て（y=長さ方向, x=幅, z=高さ）→ 最後に xy を円弧へ写像（warp）する。
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const GAP_MAX_DEG=15;                   // 関節の開き角の上限[deg]（間隔スライダーの右端）
const CLR=1.0;                          // 部材どうしのすきま最小値
const N_MIN=4, N_MAX=60;                // リブ枚数の範囲
const MIN_GAP=0.6, MIN_RIB=0.6;         // 曲げた後の関節すきま／内側リブ厚の下限
const BEND_SIDE=-1;                     // 曲げの内側: -1=左面

// ---- 入力（D, 蛇腹の長さ, 角度, 詳細）→ 全寸法。見本(D=12)の値を D/12 で拡縮し、印刷できる範囲に丸める ----
function deriveParams(u){
  const D=u.D, s=D/12, P={D_TUBE:D};
  P.T_RIB=clamp(2.4*s,1.2,3.6);          // リブ厚＝スリット幅＝ブリッジ幅
  P.WALL_SIDE=clamp(6.5*s,2.4,12);
  P.WALL_BOT=clamp(4*s,1.6,8);
  P.TOP_MARGIN=clamp(s,0.6,3);
  P.CHAMFER=clamp(s,0.4,2);
  P.C_EDGE=0.4;
  P.R_ROOT=clamp(3*s,1,5);
  P.R_CORNER=clamp(2*s,0.8,4);
  P.L_END_A=P.L_END_B=clamp(20*s,10,36);
  P.L_TIP=P.L_END_B/2;
  P.W_TIP=D+2*clamp(2*s,1.2,4);
  P.R_SHOULDER=clamp(2.5*s,1,4);
  P.R_TIPC=clamp(1.5*s,0.6,3);
  P.CLIP_MAX=Math.max(0,Math.min(3,2*(P.WALL_BOT-1)));   // 押し込み口の溝底が 1mm を切らない
  P.D_CLIP=D+clamp(u.clipExtra||0,0,P.CLIP_MAX);
  P.MOUTH=D*0.875; P.MOUTH_CLIP=P.D_CLIP*0.9;
  P.L_TAPER=P.D_CLIP>D?Math.max(0.5,P.D_CLIP-D):0;
  P.W_TOTAL=D+2*P.WALL_SIDE;
  P.T_TOTAL=P.WALL_BOT+D+P.TOP_MARGIN;
  P.Z_CTR=P.WALL_BOT+D/2;
  P.W_BRIDGE=P.GAP_HINGE=P.T_RIB;
  P.cx=P.W_TOTAL/2;
  // 押し込み口の天面開口（端ブロックの中ほどを溝径いっぱいまで広げ、両端に押さえを残す）
  P.MOUTH_OPEN=P.D_CLIP; P.TAB_LEN=P.T_RIB;
  P.RAMP=(P.MOUTH_OPEN-P.MOUTH_CLIP)/2;
  P.END_FLARE=Math.max(0,Math.min(1.2*s,P.TAB_LEN,(P.W_TOTAL-2*0.46*P.WALL_SIDE-P.MOUTH_CLIP)/2));
  P.OPEN=P.L_END_A-2*P.TAB_LEN>2*P.RAMP+1;
  // 端の形: "flat"=全幅 / "neck"=先細 / "clip"=押し込み口（太い溝＋天面開口）
  P.endA=u.endA||"clip"; P.endB=u.endB||"neck";
  // 関節の開き角[deg]: 手前側・奥側と、その間の変化のしかた（"half"=半分で切替 / "linear"=なだらか）
  P.gapA=u.gapA??10; P.gapB=u.gapB??3; P.gapMode=u.gapMode||"half";
  return P;
}

function jointAngles(N,P){
  if(P.gapMode==="linear") return Array.from({length:N},(_,i)=>P.gapA+(P.gapB-P.gapA)*(N>1?i/(N-1):0));
  const na=Math.ceil(N/2);
  return Array.from({length:N},(_,i)=>i<na?P.gapA:P.gapB);
}
// 関節角 a[deg] のときの軸上のすきま[mm]（両隣が同じ角の関節）
const gapMM=(P,a)=>P.T_RIB+(P.W_TOTAL-P.T_RIB)*Math.tan(a/2*Math.PI/180);

// 関節を開いた平面配置（geom.layout の移植）。軸(x=cx)上の y で面を持つ
function layout(P,angles){
  const N=angles.length, cx=P.cx, XHR=P.W_TOTAL-P.W_BRIDGE/2, XHL=P.W_BRIDGE/2;
  const halves=angles.map(a=>a/2*Math.PI/180), ts=halves.map(Math.tan);
  const ribs=[], gaps=[];
  let slopePrev=0, yPrev=P.L_END_A;
  for(let k=0;k<=N;k++){
    const right=k%2===0, xh=right?XHR:XHL;
    const sm=k===N?0:(k%2===0?-ts[k]:ts[k]);
    const dslope=sm-slopePrev;
    const G=P.GAP_HINGE-(xh-cx)*dslope;
    gaps.push({right,G,lo:[yPrev,slopePrev],hi:[yPrev+G,sm]});
    const y=yPrev+G;
    if(k<N){const TY=P.T_RIB/Math.cos(halves[k]); ribs.push([y,y+TY,sm]); yPrev=y+TY; slopePrev=sm;}
    else yPrev=y;
  }
  return {ribs,gaps,L:yPrev+P.L_END_B,Ls:yPrev-P.L_END_A};
}

// 蛇腹の長さに一番近いリブ枚数を選ぶ（関節角は指定どおりに保つ）
function fitSpring(P,Ls){
  let best=null;
  for(let N=N_MIN;N<=N_MAX;N++){
    const angles=jointAngles(N,P), lay=layout(P,angles);
    if(!best||Math.abs(lay.Ls-Ls)<Math.abs(best.lay.Ls-Ls)) best={N,angles,lay};
  }
  return best;
}

// 曲げ写像。Rc=中心線の平均半径。k>0 で渦巻き（φとともに半径が k·φ 増える）
function bendMap(P,L,thetaDeg,Rc,k){
  const s=BEND_SIDE, th=thetaDeg*Math.PI/180, cx=P.cx;
  const R0=Rc-k*th/2, ys=P.L_END_A, ye=L-P.L_END_B, Ox=cx+s*R0, Oy=ys;
  const phiOf=u=>k>1e-9?(-R0+Math.sqrt(R0*R0+2*k*u))/k:u/R0;
  const Rt=R0+k*th;
  const C=[Ox-s*Rt*Math.cos(th),Oy+Rt*Math.sin(th)], T=[s*Math.sin(th),Math.cos(th)], U=[Math.cos(th),-s*Math.sin(th)];
  const f=(x,y)=>{
    if(y<=ys) return [x,y];
    if(y>=ye){const a=y-ye,b=x-cx; return [C[0]+a*T[0]+b*U[0],C[1]+a*T[1]+b*U[1]];}
    const ph=phiOf(y-ys), r=R0+k*ph+s*(cx-x);
    return [Ox-s*r*Math.cos(ph),Oy+r*Math.sin(ph)];
  };
  return {f,R0,Rt,th,k};
}

// 形として成り立つか（関節すきま・内側リブ厚・部材どうしの衝突）
function checkShape(P,lay,thetaDeg,Rc,k){
  const mp=bendMap(P,lay.L,thetaDeg,Rc,k), W=P.W_TOTAL, cx=P.cx, s=BEND_SIDE;
  const xin=s>0?W:0, xout=s>0?0:W, R0=mp.R0;
  if(R0-W/2<1) return {ok:false,why:"内側の半径が小さすぎる",mp};
  const fac=x=>(R0+s*(cx-x))/R0;
  let minGap=1e9;
  for(const g of lay.gaps) for(const x of [xin,cx,xout]){
    const gf=(g.hi[0]+(x-cx)*g.hi[1])-(g.lo[0]+(x-cx)*g.lo[1]);
    minGap=Math.min(minGap,gf*fac(x));
  }
  const ribIn=P.T_RIB*fac(xin);
  if(minGap<MIN_GAP) return {ok:false,why:`関節すきまが${minGap.toFixed(2)}mmに潰れる`,mp,minGap,ribIn};
  if(ribIn<MIN_RIB) return {ok:false,why:`内側のリブが${ribIn.toFixed(2)}mmまで薄くなる`,mp,minGap,ribIn};
  // 中心線を点列にして、長さ方向に離れた2点が W+CLR より近づいたら衝突
  const n=Math.min(400,Math.ceil(lay.L/1.5)), pts=[];
  for(let i=0;i<=n;i++){const y=lay.L*i/n; pts.push([y,...mp.f(cx,y)]);}
  const far=1.6*(W+CLR), d2=(W+CLR)**2;
  for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    if(pts[j][0]-pts[i][0]<far) continue;
    const dx=pts[i][1]-pts[j][1], dy=pts[i][2]-pts[j][2];
    if(dx*dx+dy*dy<d2) return {ok:false,why:"両端が本体にぶつかる",mp,minGap,ribIn};
  }
  return {ok:true,mp,minGap,ribIn};
}

// リブ枚数を決めた後の形の判定（弧の半径＝蛇腹の長さ／角度）
function planFit(P,fit,theta){
  const th=theta*Math.PI/180, Rc=fit.lay.Ls/th;
  let chk=checkShape(P,fit.lay,theta,Rc,0), k=0;
  // 180°を超えて端がぶつかるときは渦巻きにする（外周へずらす量を少しずつ増やして最小を探す）
  if(!chk.ok && chk.why==="両端が本体にぶつかる" && theta>180){
    const k1=(P.W_TOTAL+CLR+0.5)/th;
    for(const m of [1,1.25,1.5,1.75,2,2.5]){
      const c=checkShape(P,fit.lay,theta,Rc,k1*m);
      chk=c; k=k1*m;
      if(c.ok || c.why!=="両端が本体にぶつかる") break;
    }
  }
  return {ok:chk.ok,why:chk.why,P,fit,chk,k,Rc,theta};
}
// 入力一式 → 形状の設計値（NG なら ok:false と理由）
function plan(u){
  const P=deriveParams(u);
  return planFit(P,fitSpring(P,u.len),u.theta);
}

// D・角度・詳細が決まったときに作れる 蛇腹の長さ の範囲（リブ枚数ごとに判定）
function lenRange(u){
  const P=deriveParams(u); let lo=null, hi=null;
  for(let N=N_MIN;N<=N_MAX;N++){
    const angles=jointAngles(N,P), lay=layout(P,angles);
    if(planFit(P,{N,angles,lay},u.theta).ok){ if(lo===null) lo=lay.Ls; hi=lay.Ls; }
  }
  return lo===null?null:[lo,hi];
}

// ---- WASM オブジェクトの後片付け ----
// Manifold/CrossSection は JS の GC では解放されない。生成中に作られたものを全部記録し、
// 返すもの以外を最後に delete する（しないと生成を繰り返すうちにメモリが尽きる）。
function trackWasm(wasm){
  if(wasm._scopeReady) return; wasm._scopeReady=true;
  const types=[wasm.Manifold,wasm.CrossSection];
  const reg=r=>{ if(wasm._scope){ if(Array.isArray(r)) r.forEach(reg); else if(types.some(t=>r instanceof t)) wasm._scope.push(r); } return r; };
  for(const T of types){
    const skip=["constructor","delete","isDeleted","deleteLater","isAliasOf","clone"];
    for(let pr=T.prototype;pr&&pr!==Object.prototype;pr=Object.getPrototypeOf(pr)){   // メソッドは親(embind)側にある
      for(const k of Object.getOwnPropertyNames(pr)){
        const d=Object.getOwnPropertyDescriptor(pr,k);
        if(typeof d.value!=="function"||skip.includes(k)) continue;
        const f=d.value; pr[k]=function(...a){return reg(f.apply(this,a));};
      }
    }
    for(const k of Object.getOwnPropertyNames(T)){
      const f=T[k]; if(typeof f!=="function"||["length","name","prototype"].includes(k)) continue;
      T[k]=function(...a){return reg(f.apply(this,a));};
    }
  }
  wasm._reg=reg;
}
function buildPart(wasm,pl){
  trackWasm(wasm); wasm._scope=[];
  try{
    const out=buildPartInner(wasm,pl), keep=out.part;
    for(const o of new Set(wasm._scope)) if(o!==keep) o.delete();
    return out;
  }catch(e){ for(const o of new Set(wasm._scope)) try{o.delete();}catch(_){} throw e; }
  finally{ wasm._scope=null; }
}

// ---- 3D 形状（Manifold）----
function buildPartInner(wasm,pl){
  const {Manifold,CrossSection}=wasm, P=pl.P, lay=pl.fit.lay, L=lay.L, cx=P.cx, W=P.W_TOTAL;
  const CS=(pts)=>wasm._reg(new CrossSection([pts],"NonZero"));
  const rect=(x0,y0,x1,y1)=>CS([[x0,y0],[x1,y0],[x1,y1],[x0,y1]]);
  const roundRect=(x0,y0,x1,y1,r)=>rect(x0,y0,x1,y1).offset(-r,"Round",2,48).offset(r,"Round",2,48);
  const arcPts=(c,r,a0,a1,n)=>{const o=[];for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;o.push([c[0]+r*Math.cos(t),c[1]+r*Math.sin(t)]);}return o;};
  // 角 C（辺の向き u1,u2）を半径 R で丸めるときに削る/足す領域。円との差ではなく多角形で直接作る
  // （接する円の差を取ると接点に微小な破片が残り、ブーリアンが荒れる）
  const fillet=(C,u1,u2,R)=>{
    if(R<=0) return null;
    const n=v=>{const l=Math.hypot(v[0],v[1]);return [v[0]/l,v[1]/l];};
    u1=n(u1); u2=n(u2);
    const ang=Math.acos(clamp(u1[0]*u2[0]+u1[1]*u2[1],-1,1));
    const dt=R/Math.tan(ang/2), dc=R/Math.sin(ang/2), b=n([u1[0]+u2[0],u1[1]+u2[1]]);
    const T1=[C[0]+dt*u1[0],C[1]+dt*u1[1]], T2=[C[0]+dt*u2[0],C[1]+dt*u2[1]], O=[C[0]+dc*b[0],C[1]+dc*b[1]];
    const a0=Math.atan2(T1[1]-O[1],T1[0]-O[0]); let a1=Math.atan2(T2[1]-O[1],T2[0]-O[0]);
    if(a1-a0>Math.PI) a1-=2*Math.PI; if(a1-a0<-Math.PI) a1+=2*Math.PI;
    const e=0.01, ar=arcPts(O,R,a0,a1,16);   // 両辺側へ e だけはみ出させ、隣の形と確実に重ねる
    return CS([[C[0]-e*(u1[0]+u2[0]),C[1]-e*(u1[1]+u2[1])],[T1[0]-e*u2[0],T1[1]-e*u2[1]],...ar.slice(1,-1),[T2[0]-e*u1[0],T2[1]-e*u1[1]]]);
  };
  // 外形（上面図）
  const nA=P.endA==="neck", nB=P.endB==="neck";
  let solid=roundRect(0,nA?P.L_TIP:0,W,nB?L-P.L_TIP:L,P.R_CORNER);
  if(nB){
    solid=solid.add(roundRect(cx-P.W_TIP/2,L-P.L_TIP-3,cx+P.W_TIP/2,L,P.R_TIPC));
    for(const sg of [-1,1]){const fl=fillet([cx+sg*P.W_TIP/2,L-P.L_TIP],[sg,0],[0,1],P.R_SHOULDER); if(fl) solid=solid.add(fl);}
  }
  if(nA){
    solid=solid.add(roundRect(cx-P.W_TIP/2,0,cx+P.W_TIP/2,P.L_TIP+3,P.R_TIPC));
    for(const sg of [-1,1]){const fl=fillet([cx+sg*P.W_TIP/2,P.L_TIP],[sg,0],[0,-1],P.R_SHOULDER); if(fl) solid=solid.add(fl);}
  }
  // スリット（くさび＋丸い先端＋根元フィレット）
  const cuts=[];
  for(const g of lay.gaps){
    const [ylo0,slo]=g.lo,[yhi0,shi]=g.hi;
    const ylo=x=>ylo0+(x-cx)*slo, yhi=x=>yhi0+(x-cx)*shi;
    const [xo,xt,sg]=g.right?[-6,W-P.W_BRIDGE,1]:[W+6,P.W_BRIDGE,-1];
    const rp=x=>(yhi(x)-ylo(x))/2*Math.cos((slo+shi)/2);
    let xe=xt-sg*rp(xt); xe=xt-sg*rp(xe);
    // くさび＋先端の半円を1つの多角形に（半円の両端＝くさびの端点で一致させる）
    const yl=ylo(xe), yh=yhi(xe), rc=(yh-yl)/2, ym=(yl+yh)/2;
    const cap=sg>0?arcPts([xe,ym],rc,-Math.PI/2,Math.PI/2,16):arcPts([xe,ym],rc,-Math.PI/2,-3*Math.PI/2,16);
    cuts.push(CS([[xo,ylo(xo)],...cap,[xo,yhi(xo)]]));
    const x2=g.right?0:W;
    for(const fl of [fillet([x2,ylo(x2)],[0,-1],[sg,sg*slo],P.R_ROOT),fillet([x2,yhi(x2)],[0,1],[sg,sg*shi],P.R_ROOT)]) if(fl) cuts.push(fl);
  }
  // フィレット三角の先端が外形からはみ出した面積0の欠片を捨てる
  const top=CrossSection.compose(solid.subtract(CrossSection.union(cuts)).decompose().filter(q=>q.area()>0.01));
  // 本体：上下ふちの面取り(C_EDGE)は、縁の帯(内寄せ C/2・高さ C)を引いて1段で近似
  // （柱を積む足し算方式だと溝とのブーリアンで微小な穴が出た）
  const H=P.T_TOTAL, c=P.C_EDGE;
  const band=top.offset(2,"Square").subtract(top.offset(-c/2,"Round",2,24));
  const bands=Manifold.union([band.extrude(c+1).translate([0,0,-1]),band.extrude(c+1).translate([0,0,H-c])]);
  const body=solidOnly(top.extrude(H).subtract(bands));
  // 溝の工具：station 間を凸な部品(円錐台・スロット・面取り三角)の hull でつなぐ
  const Zc=P.Z_CTR, TT=H+1.5, CH=P.CHAMFER, SEG=72;
  const circ=(y,d)=>{const a=[];for(let j=0;j<SEG;j++){const t=2*Math.PI*j/SEG;a.push([cx+d/2*Math.cos(t),y,Zc+d/2*Math.sin(t)]);}return a;};
  const slot=(y,m)=>[[cx-m/2,y,Zc],[cx+m/2,y,Zc],[cx+m/2,y,TT],[cx-m/2,y,TT]];
  const tri=(y,m,sg)=>{const xm=cx+sg*m/2;return [[xm,y,H-CH],[xm+sg*(CH+1.5),y,TT],[xm,y,TT]];};
  const pieces=[];
  const seg=(a,b)=>{
    if(b[0]-a[0]<1e-6) return;
    const e=0.01, t=(b[1]-a[1])/(b[0]-a[0]), q=(b[2]-a[2])/(b[0]-a[0]);
    const A=[a[0]-e,a[1]-t*e,a[2]-q*e], B=[b[0]+e,b[1]+t*e,b[2]+q*e];
    pieces.push(Manifold.hull([...circ(A[0],A[1]),...circ(B[0],B[1])]));
    pieces.push(Manifold.hull([...slot(A[0],A[2]),...slot(B[0],B[2])]));
    for(const sg of [-1,1]) pieces.push(Manifold.hull([...tri(A[0],A[2],sg),...tri(B[0],B[2],sg)]));
  };
  const nM=Math.ceil((L+2)/20);   // 本体の溝を全長に。長い凸包1本だと細長い三角でブーリアンが荒れるので刻む
  for(let i=0;i<nM;i++) seg([-1+(L+2)*i/nM,P.D_TUBE,P.MOUTH],[-1+(L+2)*(i+1)/nM,P.D_TUBE,P.MOUTH]);
  // 押し込み口：端面からの距離 u で station を作り、手前端は y=u、奥端は y=L-u に置く
  const A=P.L_END_A, Dc=P.D_CLIP, MC=P.MOUTH_CLIP;
  let st;   // [u, 溝径, 溝口]
  if(P.OPEN){
    const FL=P.END_FLARE, ME=MC+2*FL, MO=P.MOUTH_OPEN, y0=P.TAB_LEN, y1=A-P.TAB_LEN, r=P.RAMP;
    st=[[-1,Dc,ME+2],[0,Dc,ME],[FL,Dc,MC],[y0,Dc,MC],[y0+r,Dc,MO],[y1-r,Dc,MO],[y1,Dc,MC],[A-FL,Dc,MC],[A+0.3,Dc,ME+0.6]];
  } else st=[[-1,Dc,MC],[A,Dc,MC]];
  const segs=[];
  for(let i=0;i+1<st.length;i++) segs.push([st[i],st[i+1]]);
  if(P.L_TAPER>0) segs.push([[A,Dc,MC],[A+P.L_TAPER,P.D_TUBE,P.MOUTH]]);
  for(const [end,sgn,y0] of [[P.endA,1,0],[P.endB,-1,L]]){
    if(end!=="clip") continue;
    for(const [a,b] of segs){
      const pa=[y0+sgn*a[0],a[1],a[2]], pb=[y0+sgn*b[0],b[1],b[2]];
      sgn>0?seg(pa,pb):seg(pb,pa);
    }
  }
  const cutter=Manifold.union(pieces);
  function solidOnly(m){ // 体積をもつ塊だけ残す（段の境目にできる体積0の薄膜を捨てる）
    const ps=m.decompose().filter(q=>Math.abs(q.getProperties().volume)>1e-3);
    return ps.length===1?ps[0]:Manifold.compose(ps);
  }
  const flat=solidOnly(body.subtract(cutter));
  const f=pl.chk.mp.f;
  // 曲げの弦たるみを 0.05mm 以下に抑える辺長（内側の半径が大きいほど粗くてよい）
  const lr=clamp(Math.sqrt(8*0.05*Math.max(1,pl.chk.mp.R0-W/2)),1.0,4.0);
  let part=flat.refineToLength(lr).warp(v=>{const p=f(v[0],v[1]);v[0]=p[0];v[1]=p[1];});
  part=solidOnly(part);
  const bb=part.boundingBox();
  part=part.translate([-bb.min[0],-bb.min[1],-bb.min[2]]);
  // 中心線（プレビューでホースを描く用）
  const center=[]; for(let i=0;i<=300;i++){const y=-2+(L+4)*i/300;const p=f(cx,y);center.push([p[0]-bb.min[0],p[1]-bb.min[1],Zc-bb.min[2]]);}
  return {part,center};
}
// ==CORE END==


// ---- UI ----
const DEF={D:"12",theta:"100",len:"99.8",gapA:"10",gapB:"3",gapMode:"half",endA:"clip",endB:"neck",clip:"1"};
const fmt=(v,d=1)=>(+v).toFixed(d).replace(/\.0+$/,"").replace(/(\.\d*?)0+$/,"$1");
const END_NAME={clip:"押し込み口",neck:"先細",flat:"全幅"};
function readU(){
  return {D:+$("D").value,theta:+$("theta").value,len:+$("len").value,
          gapA:+$("gapA").value,gapB:+$("gapB").value,gapMode:$("gapMode").value,
          endA:$("endA").value,endB:$("endB").value,clipExtra:+$("clip").value};
}
let range=null, pl=null, result=null;
function refreshRange(){
  const u=readU(); range=lenRange(u);
  const inp=$("len");
  if(range){
    inp.min=fmt(Math.floor(range[0]*10)/10); inp.max=fmt(Math.ceil(range[1]*10)/10);
    inp.value=clamp(+inp.value,+inp.min,+inp.max);
    $("lenRange").textContent=`この直径・角度・間隔で作れる長さ: ${fmt(range[0])}〜${fmt(range[1])} mm`;
  } else $("lenRange").textContent="この組み合わせでは作れる長さがありません（角度か間隔を下げてください）";
  $("clip").max=fmt(deriveParams(u).CLIP_MAX,1);
}
function syncLabels(){
  const P=deriveParams(readU());
  $("DV").textContent=fmt($("D").value)+" mm"; $("Dn").value=$("D").value;
  $("thetaV").textContent=$("theta").value+"°"; $("thetan").value=$("theta").value;
  $("lenV").textContent=fmt($("len").value)+" mm"; $("lenn").value=$("len").value;
  for(const k of ["gapA","gapB"]) $(k+"V").textContent=`すきま ${fmt(gapMM(P,+$(k).value),2)} mm（開き ${fmt($(k).value)}°）`;
  $("clipV").textContent="+"+fmt($("clip").value)+" mm";
  const pv=`${$("gapA").value},${$("gapB").value}`;
  $("gapPreset").value=[...$("gapPreset").options].some(o=>o.value===pv)?pv:"";
}
function renderInfo(){
  const el=$("info");
  if(!range||!pl){el.innerHTML='<span class="ng">作れる形がありません</span>';return;}
  if(!pl.ok){el.innerHTML=`<span class="ng">この組み合わせは不可: ${pl.why}</span>`;return;}
  const P=pl.P, f=pl.fit, L=[];
  L.push(`リブ <b>${f.N}枚</b>・実際の蛇腹の長さ <b>${fmt(f.lay.Ls,1)} mm</b>・全長 ${fmt(f.lay.L,1)} mm`);
  L.push(`弧の直径（ホース中心） <b>${fmt(2*pl.Rc,1)} mm</b>`);
  L.push(`断面 <b>幅${fmt(P.W_TOTAL,2)} × 厚み${fmt(P.T_TOTAL,2)} mm</b>・リブ厚 ${fmt(P.T_RIB,2)}`);
  L.push(`溝 Ø${fmt(P.D_TUBE,2)}（溝口 ${fmt(P.MOUTH,2)}）`+([P.endA,P.endB].includes("clip")?`／押し込み口 Ø${fmt(P.D_CLIP,2)}（溝口 ${fmt(P.MOUTH_CLIP,2)}）`:""));
  L.push(`曲げ後の内側リブ ${fmt(pl.chk.ribIn,2)} mm・関節すきま最小 ${fmt(pl.chk.minGap,2)} mm`);
  if(pl.k>0) L.push(`<span class="warn">端どうしが重なるので渦巻きにしています（中心線の半径 ${fmt(pl.chk.mp.R0,1)} → ${fmt(pl.chk.mp.Rt,1)} mm）</span>`);
  if(result){
    const bb=result.part.boundingBox(), ex=bb.max.map((v,i)=>v-bb.min[i]);
    const vol=result.part.getProperties().volume/1000;
    L.push(`外形 <b>${fmt(ex[0],1)} × ${fmt(ex[1],1)} × ${fmt(ex[2],1)} mm</b>・体積 ${fmt(vol,2)} cm³（PETGで約${fmt(vol*1.27,0)} g）`);
    if(Math.max(ex[0],ex[1])>180) L.push('<span class="warn">A1 mini のプレート（180 mm）に収まりません</span>');
  }
  el.innerHTML=L.join("<br>");
}
function settingsLines(){
  const L=[["ホース直径",fmt($("D").value)+"mm"],["角度",$("theta").value+"°"],["蛇腹の長さ",fmt($("len").value)+"mm"],
    ["間隔",`手前${fmt($("gapA").value)}°/奥${fmt($("gapB").value)}°`+($("gapMode").value==="linear"?"（なだらか）":"")],
    ["先の形",`手前${END_NAME[$("endA").value]}/奥${END_NAME[$("endB").value]}`]];
  if($("clip").value!==DEF.clip) L.push(["押し込み口の溝","+"+fmt($("clip").value)+"mm"]);
  return L;
}
function renderSummary(){
  const L=settingsLines();
  $("summary").innerHTML="<b>設定値</b><br>"+L.map(([k,v])=>`${k}=${v}`).join("<br>")+`<button id="copyBtn">コピー</button>`;
  $("copyBtn").onclick=()=>navigator.clipboard.writeText(L.map(([k,v])=>`${k}=${v}`).join(" / "))
    .then(()=>{$("copyBtn").textContent="コピーしました";setTimeout(()=>$("copyBtn").textContent="コピー",1200);});
}

// ---- 3D プレビュー ----
let scene,camera,renderer,controls,group=null,lastSize=0;
function initGL(){
  const view=$("view");
  renderer=new THREE.WebGLRenderer({antialias:true});
  view.insertBefore(renderer.domElement,view.firstChild);
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x1d1d1f);
  camera=new THREE.PerspectiveCamera(35,1,1,5000);
  camera.up.set(0,0,1);
  scene.add(new THREE.AmbientLight(0xffffff,.55));
  const dl=new THREE.DirectionalLight(0xffffff,1.2); dl.position.set(60,-80,160); scene.add(dl);
  const dl2=new THREE.DirectionalLight(0x88aaff,.4); dl2.position.set(-80,60,-40); scene.add(dl2);
  controls=new OrbitControls(camera,renderer.domElement);
  const resize=()=>{const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();};
  window.addEventListener("resize",resize); resize();
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
}
function meshToGeo(mesh){
  const tv=mesh.triVerts, vp=mesh.vertProperties, n=tv.length, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){const v=tv[i]*3;pos[i*3]=vp[v];pos[i*3+1]=vp[v+1];pos[i*3+2]=vp[v+2];}
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(pos,3)); g.computeVertexNormals(); return g;
}
function label(txt,p,dz,size){
  const cv=document.createElement("canvas"); cv.width=128; cv.height=64;
  const x=cv.getContext("2d"); x.fillStyle="rgba(0,0,0,.55)"; x.beginPath(); x.roundRect(4,8,120,48,10); x.fill();
  x.fillStyle="#ffd28a"; x.font="bold 30px sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(txt,64,33);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));
  const s=Math.max(12,size*0.1); sp.scale.set(s,s/2,1); sp.position.set(p[0],p[1],p[2]+dz); return sp;
}
function showMeshes(){
  if(group){scene.remove(group);group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material.map)o.material.map.dispose();});}
  group=new THREE.Group();
  group.add(new THREE.Mesh(meshToGeo(result.part.getMesh()),new THREE.MeshStandardMaterial({color:0x8fb8d8,roughness:.5,flatShading:true})));
  const curve=new THREE.CatmullRomCurve3(result.center.map(p=>new THREE.Vector3(...p)));
  group.add(new THREE.Mesh(new THREE.TubeGeometry(curve,300,pl.P.D_TUBE/2,24,false),
    new THREE.MeshStandardMaterial({color:0xff9a3c,transparent:true,opacity:.35,depthWrite:false})));
  const bb=result.part.boundingBox(), c=bb.min.map((v,i)=>(v+bb.max[i])/2), size=Math.max(...bb.max.map((v,i)=>v-bb.min[i]));
  const cp=result.center;
  for(const [txt,p] of [["手前",cp[0]],["奥",cp[cp.length-1]]]) group.add(label(txt,p,pl.P.T_TOTAL+6,size));
  group.position.set(-c[0],-c[1],-c[2]);
  scene.add(group);
  if(Math.abs(size-lastSize)>size*0.25){   // 大きさが大きく変わったときだけ視点を合わせ直す
    camera.position.set(size*0.2,-size*1.5,size*1.4); controls.target.set(0,0,0); lastSize=size;
  }
}

// ---- STL ----
function toSTL(mesh){
  const tv=mesh.triVerts, vp=mesh.vertProperties, n=tv.length/3;
  const buf=new ArrayBuffer(84+n*50), dv=new DataView(buf); dv.setUint32(80,n,true); let off=84;
  for(let t=0;t<n;t++){
    const a=tv[t*3]*3,b=tv[t*3+1]*3,c=tv[t*3+2]*3;
    const ax=vp[a],ay=vp[a+1],az=vp[a+2],bx=vp[b],by=vp[b+1],bz=vp[b+2],cx=vp[c],cy=vp[c+1],cz=vp[c+2];
    const ux=bx-ax,uy=by-ay,uz=bz-az,wx=cx-ax,wy=cy-ay,wz=cz-az;
    let nx=uy*wz-uz*wy,ny=uz*wx-ux*wz,nz=ux*wy-uy*wx; const l=Math.hypot(nx,ny,nz)||1;
    for(const v of [nx/l,ny/l,nz/l,ax,ay,az,bx,by,bz,cx,cy,cz]){dv.setFloat32(off,v,true);off+=4;}
    dv.setUint16(off,0,true);off+=2;
  }
  return buf;
}
$("dlstl").addEventListener("click",()=>{
  if(!result) return;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([toSTL(result.part.getMesh())],{type:"model/stl"}));
  a.download=`蛇腹サポーター_ホース${fmt($("D").value)}_長さ${fmt(pl.fit.lay.Ls,1)}_${$("theta").value}度.stl`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
});

// ---- 更新 ----
let timer=null;
function update(){
  syncLabels();
  $("status").textContent="生成中…";
  clearTimeout(timer);
  timer=setTimeout(()=>{
    try{
      if(result){result.part.delete(); result=null;}   // WASM 側のメモリを解放
      pl=range?plan(readU()):null;
      if(pl&&pl.ok){ result=buildPart(wasm,pl); showMeshes();
        $("status").textContent=`${result.part.numTri().toLocaleString()} 三角形`; }
      else $("status").textContent="";
    }catch(e){ $("status").textContent="エラー: "+e.message; console.error(e); }
    $("dlstl").disabled=!result;
    renderInfo(); renderSummary();
  },250);
}
function onRangeInputs(){ refreshRange(); update(); }
for(const id of ["D","theta","gapA","gapB","gapMode","endA","endB","clip"]) $(id).addEventListener("input",onRangeInputs);
$("len").addEventListener("input",update);
$("gapPreset").addEventListener("input",()=>{const v=$("gapPreset").value; if(!v) return;
  const [a,b]=v.split(","); $("gapA").value=a; $("gapB").value=b; onRangeInputs();});
for(const [n,id] of [["Dn","D"],["thetan","theta"],["lenn","len"]])
  $(n).addEventListener("change",()=>{const t=$(id); t.value=clamp(+$(n).value,+t.min,+t.max); t.dispatchEvent(new Event("input"));});
document.querySelectorAll(".mb").forEach(b=>b.addEventListener("click",()=>{
  const inp=$(b.dataset.t); b.dataset.d==="1"?inp.stepUp():inp.stepDown(); inp.dispatchEvent(new Event("input"));
}));

initGL(); refreshRange(); update();
window._plan=plan; window._getResult=()=>result; window._lenRange=lenRange;
</script>
